<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Slate Background with Rounded Corners -->
  <rect width="192" height="192" rx="42" fill="url(#bgGradient)"/>
  <rect width="192" height="192" rx="42" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Glowing Outer Pulse Ring -->
  <circle cx="96" cy="96" r="66" fill="none" stroke="#e11d48" stroke-width="2" opacity="0.3"/>
  <circle cx="96" cy="96" r="54" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Central Shield Shape with Glow -->
  <path d="M96 38 L142 58 C142 98 122 134 96 150 C70 134 50 98 50 58 Z" 
        fill="url(#shieldGradient)" 
        filter="url(#glow)"/>

  <!-- Inner Protective Shield Core -->
  <path d="M96 46 L134 63 C134 96 117 126 96 140 C75 126 58 96 58 63 Z" 
        fill="#020617" 
        opacity="0.85"/>

  <!-- Security Check Icon -->
  <path d="M82 94 L92 104 L114 80" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Active Emerald Online Beacon Dot -->
  <circle cx="136" cy="136" r="10" fill="#10b981"/>
  <circle cx="136" cy="136" r="10" fill="none" stroke="#020617" stroke-width="3"/>
  <circle cx="136" cy="136" r="14" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5"/>
</svg>
