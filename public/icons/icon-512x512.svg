<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#090d1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="80%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Slate Background with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient512)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#1e293b" stroke-width="8"/>

  <!-- Outer Orbit Radar Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#e11d48" stroke-width="4" opacity="0.25"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="10 10" opacity="0.35"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#e11d48" stroke-width="2" opacity="0.2"/>

  <!-- Central Shield Shape with Glow -->
  <path d="M256 90 L390 150 C390 270 330 380 256 422 C182 380 122 270 122 150 Z" 
        fill="url(#shieldGradient512)" 
        filter="url(#glow512)"/>

  <!-- Inner Dark Core Shield -->
  <path d="M256 114 L368 164 C368 262 318 356 256 394 C194 356 144 262 144 164 Z" 
        fill="#020617" 
        opacity="0.9"/>

  <!-- Security Check Icon -->
  <path d="M214 250 L244 280 L308 210" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Active Emerald Online Beacon Dot -->
  <circle cx="365" cy="365" r="26" fill="#10b981"/>
  <circle cx="365" cy="365" r="26" fill="none" stroke="#020617" stroke-width="8"/>
  <circle cx="365" cy="365" r="38" fill="none" stroke="#10b981" stroke-width="5" opacity="0.5"/>
</svg>
